name: build

on:
  push:
    branches: [main, master]
    tags:
      - v*
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ---- Rust toolchain ----
      - name: Install Rust
        run: |
          rustup toolchain install stable --component llvm-tools-preview
          rustup default stable

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-llvm-cov
            nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ---- Quality gates ----
      - name: Check code format
        run: cargo fmt -- --check

      - name: Cargo check
        run: cargo check --all

      - name: Clippy
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

      - name: Run tests
        run: cargo nextest run --all-features --no-tests=pass

      # ---- Changelog & Release (only for tags) ----
      - name: Install git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          curl -L https://github.com/orhun/git-cliff/releases/download/v2.11.0/git-cliff-2.11.0-x86_64-unknown-linux-gnu.tar.gz \
          | tar xz
          sudo mv git-cliff /usr/local/bin/

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git-cliff -vv --latest --strip header -o CHANGES.md
          cat CHANGES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGES.md
